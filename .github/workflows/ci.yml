# ============================================================
# Charlie MJ Video Downloader - Continuous Integration
# ============================================================
# Purpose:
# - Validate the frontend
# - Validate the Rust/Tauri backend
# - Run automatically on pushes to main
# - Run automatically for pull requests
#
# IMPORTANT:
# This workflow ONLY validates the project.
#
# It does NOT create the Windows installer.
#
# The Windows installer is created by:
#     windows-release.yml
#
# Workflow:
#
# Developer
#     ↓
# Git Push / Pull Request
#     ↓
# CI
# ├── Frontend Build
# └── Rust Check
#     ↓
# If successful
#     ↓
# Windows Release
#     ↓
# Tauri Build
#     ↓
# Windows .exe installer
# ============================================================

name: CI


# ============================================================
# Workflow Triggers
# ============================================================

on:

  # ----------------------------------------------------------
  # Run CI when code is pushed to the main branch.
  # ----------------------------------------------------------
  push:
    branches:
      - "main"

  # ----------------------------------------------------------
  # Run CI for pull requests.
  #
  # This helps detect frontend or Rust problems before code
  # is merged into main.
  # ----------------------------------------------------------
  pull_request:


# ============================================================
# Jobs
# ============================================================

jobs:


  # ==========================================================
  # Frontend Build
  # ==========================================================
  frontend:
    name: Frontend Build
    runs-on: windows-latest

    # All shell commands in this job run from the app directory.
    defaults:
      run:
        working-directory: app

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      # Downloads the repository source code to the GitHub
      # Actions runner.
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      # Installs Node.js 22 for the React/Vite frontend.
      #
      # npm cache is enabled to speed up dependency installation.
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json


      # --------------------------------------------------------
      # Install frontend dependencies
      # --------------------------------------------------------
      # npm ci performs a clean installation using the exact
      # dependency versions recorded in package-lock.json.
      # --------------------------------------------------------
      - name: Install dependencies
        run: npm ci


      # --------------------------------------------------------
      # Build frontend
      # --------------------------------------------------------
      # Compiles the React/Vite application.
      #
      # This confirms that the frontend can be built successfully
      # before the Windows release process starts.
      # --------------------------------------------------------
      - name: Build frontend
        run: npm run build


  # ==========================================================
  # Rust / Tauri Backend Check
  # ==========================================================
  rust:
    name: Rust Check
    runs-on: windows-latest

    # All Cargo commands in this job run from the Tauri project.
    defaults:
      run:
        working-directory: app/src-tauri

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Rust
      # --------------------------------------------------------
      # Installs the stable Rust toolchain on the GitHub runner.
      #
      # Rust/Cargo does NOT need to be installed on your local PC
      # for this workflow to work.
      # --------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable


      # --------------------------------------------------------
      # Check Rust code
      # --------------------------------------------------------
      # cargo check validates the Rust/Tauri backend and its
      # dependencies.
      #
      # IMPORTANT:
      # cargo check does NOT create the Windows .exe installer.
      # --------------------------------------------------------
      - name: Check Rust code
        run: cargo check