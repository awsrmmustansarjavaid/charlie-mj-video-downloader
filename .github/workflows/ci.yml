# ============================================================
# Charlie MJ Video Downloader - Continuous Integration
# ============================================================
#
# Purpose:
#
# This workflow validates the application before a Windows
# release build is created.
#
# It validates two independent parts of the application:
#
# 1. React / TypeScript / Vite frontend
# 2. Rust / Tauri backend
#
#
# IMPORTANT:
#
# This workflow ONLY performs CI validation.
#
# It does NOT create:
#
# - Windows .exe
# - Windows .msi
# - NSIS installer
# - GitHub Release
#
# The Windows installer is created separately by:
#
#     .github/workflows/windows-release.yml
#
#
# ============================================================
# CI PIPELINE
# ============================================================
#
# Developer
#     |
#     v
# Git Push / Pull Request
#     |
#     v
# GitHub Actions
#     |
#     +----------------------------------+
#     |              CI                  |
#     |                                  |
#     | Frontend Build    Rust Check     |
#     |       |               |          |
#     |       v               v          |
#     | package.json       Cargo.toml     |
#     |       |               |          |
#     | package-lock.json   Rust stable  |
#     |       |               |          |
#     |       v               v          |
#     |     npm ci         cargo check    |
#     |       |                          |
#     |       v                          |
#     |   npm run build                  |
#     |       |                          |
#     |       v                          |
#     |      dist/                       |
#     +----------------------------------+
#                    |
#                    v
#                CI SUCCESS
#                    |
#                    v
#        Windows Release Workflow
#                    |
#                    v
#               Tauri Build
#                    |
#                    v
#          Windows NSIS Installer
#                    |
#                    v
#                  .exe
#
# ============================================================


name: CI


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:

  # Run CI whenever changes are pushed to main.
  push:
    branches:
      - main

  # Run CI for pull requests.
  #
  # This allows frontend and backend problems to be detected
  # before changes are merged into main.
  pull_request:


# ============================================================
# JOBS
# ============================================================

jobs:


  # ==========================================================
  # FRONTEND BUILD
  # ==========================================================
  #
  # Purpose:
  #
  # Validate the React/Vite frontend.
  #
  # Validation sequence:
  #
  # 1. Checkout repository
  # 2. Install Node.js 22
  # 3. Verify package.json
  # 4. Verify package-lock.json
  # 5. Validate package-lock.json JSON
  # 6. Run npm ci
  # 7. Run npm run build
  # 8. Verify dist/ directory
  #
  #
  # IMPORTANT:
  #
  # npm ci is intentionally used instead of npm install.
  #
  # npm ci provides a clean and reproducible dependency
  # installation based on package-lock.json.
  #
  # package.json and package-lock.json must therefore remain
  # synchronized.
  #
  # When dependencies are changed locally:
  #
  #     npm install
  #
  # should be used to regenerate package-lock.json.
  #
  # Then both package.json and package-lock.json should be
  # committed to the repository.
  #
  # ==========================================================

  frontend:

    name: Frontend Build

    runs-on: windows-latest


    # All commands in this job execute from:
    #
    #     app/
    #
    # Therefore package.json, package-lock.json, src/,
    # vite.config.*, and dist/ are referenced relative to app/.
    defaults:
      run:
        working-directory: app


    steps:


      # ======================================================
      # STEP 1 - CHECKOUT REPOSITORY
      # ======================================================
      #
      # Downloads the repository source code to the temporary
      # GitHub Actions Windows runner.
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # STEP 2 - SETUP NODE.JS
      # ======================================================
      #
      # Node.js 22 is used for:
      #
      # - npm
      # - React
      # - TypeScript
      # - Vite
      # - Tauri CLI
      #
      # npm dependency caching is enabled.
      #
      # The cache uses:
      #
      #     app/package-lock.json
      #
      # as the dependency cache key.
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json


      # ======================================================
      # STEP 3 - VERIFY package.json
      # ======================================================
      #
      # Confirms that the frontend project contains its npm
      # package definition.
      # ======================================================

      - name: Verify package.json
        shell: pwsh
        run: |

          Write-Host "============================================"
          Write-Host "Checking package.json"
          Write-Host "============================================"

          if (-not (Test-Path "package.json")) {

            Write-Error "ERROR: app/package.json was not found."

            exit 1
          }

          Write-Host "package.json found successfully."
          Write-Host ""


      # ======================================================
      # STEP 4 - VERIFY package-lock.json
      # ======================================================
      #
      # npm ci requires a valid package-lock.json.
      #
      # This step checks:
      #
      # - The file exists
      # - The file is not empty
      #
      # JSON validity is checked separately in the next step.
      # ======================================================

      - name: Verify package-lock.json
        shell: pwsh
        run: |

          Write-Host "============================================"
          Write-Host "Checking package-lock.json"
          Write-Host "============================================"

          if (-not (Test-Path "package-lock.json")) {

            Write-Error "ERROR: app/package-lock.json was not found."
            Write-Error ""
            Write-Error "npm ci requires a committed package-lock.json."
            Write-Error ""
            Write-Error "Regenerate the lockfile locally with:"
            Write-Error "  cd app"
            Write-Error "  npm install"

            exit 1
          }

          $lockFileSize = (Get-Item "package-lock.json").Length

          if ($lockFileSize -le 0) {

            Write-Error "ERROR: package-lock.json is empty."

            exit 1
          }

          Write-Host "package-lock.json found successfully."
          Write-Host "Lockfile size: $lockFileSize bytes."
          Write-Host ""


      # ======================================================
      # STEP 5 - VALIDATE package-lock.json
      # ======================================================
      #
      # Node.js is used to parse the lockfile.
      #
      # This is intentional.
      #
      # npm package-lock.json files can contain a root package
      # entry with an empty property name:
      #
      #     "packages": {
      #       "": {
      #         ...
      #       }
      #     }
      #
      # PowerShell ConvertFrom-Json can reject this valid npm
      # structure on the GitHub Actions runner.
      #
      # Node.js JSON.parse() correctly handles it.
      #
      # This step DOES NOT modify the lockfile.
      #
      # It only verifies that package-lock.json is valid JSON.
      # ======================================================

      - name: Validate package-lock.json JSON
        shell: pwsh
        run: |

          Write-Host "============================================"
          Write-Host "Validating package-lock.json JSON"
          Write-Host "============================================"

          node -e "const fs=require('fs'); try { const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')); if (!lock || typeof lock !== 'object' || Array.isArray(lock)) throw new Error('The lockfile root must be a JSON object.'); console.log('package-lock.json contains valid JSON.'); console.log('lockfileVersion:', lock.lockfileVersion ?? 'not specified'); } catch (error) { console.error('ERROR: package-lock.json contains invalid JSON.'); console.error(error.message); process.exit(1); }"

          if ($LASTEXITCODE -ne 0) {

            Write-Error ""
            Write-Error "The npm lockfile is malformed."
            Write-Error ""
            Write-Error "Regenerate it locally with:"
            Write-Error "  cd app"
            Write-Error "  Remove-Item package-lock.json -Force"
            Write-Error "  npm install"
            Write-Error "  npm ci"
            Write-Error ""
            Write-Error "Then commit the regenerated package-lock.json."

            exit 1
          }

          Write-Host ""


      # ======================================================
      # STEP 6 - INSTALL FRONTEND DEPENDENCIES
      # ======================================================
      #
      # npm ci is the authoritative dependency installation
      # check for this CI workflow.
      #
      # It verifies that package.json and package-lock.json
      # are compatible and installs the exact dependency tree
      # described by the lockfile.
      #
      # DO NOT replace npm ci with npm install simply to
      # bypass a lockfile error.
      #
      # If npm ci fails because the files are out of sync,
      # regenerate package-lock.json locally with npm install
      # and commit it.
      # ======================================================

      - name: Install frontend dependencies
        run: npm ci


      # ======================================================
      # STEP 7 - BUILD FRONTEND
      # ======================================================
      #
      # Runs the build script defined in package.json.
      #
      # Current build command:
      #
      #     tsc -b && vite build
      #
      # This validates:
      #
      # - TypeScript compilation
      # - React source code
      # - Vite configuration
      # - Production frontend bundling
      # ======================================================

      - name: Build frontend
        run: npm run build


      # ======================================================
      # STEP 8 - VERIFY FRONTEND BUILD OUTPUT
      # ======================================================
      #
      # Vite should create:
      #
      #     app/dist/
      #
      # This confirms that the production frontend build
      # generated its expected output directory.
      # ======================================================

      - name: Verify frontend build output
        shell: pwsh
        run: |

          Write-Host "============================================"
          Write-Host "Checking frontend build output"
          Write-Host "============================================"

          if (-not (Test-Path "dist")) {

            Write-Error "ERROR: frontend dist/ directory was not created."
            Write-Error ""
            Write-Error "The Vite production build did not produce the expected output."

            exit 1
          }

          Write-Host "Frontend build output found successfully."
          Write-Host ""

          Write-Host "Frontend Build completed successfully."


  # ==========================================================
  # RUST / TAURI BACKEND CHECK
  # ==========================================================
  #
  # Purpose:
  #
  # Validate the Rust/Tauri backend independently from the
  # frontend.
  #
  # Validation sequence:
  #
  # 1. Checkout repository
  # 2. Verify Cargo.toml
  # 3. Install stable Rust
  # 4. Run cargo check
  #
  # cargo check validates the Rust project without producing
  # the final Windows installer.
  #
  # ==========================================================

  rust:

    name: Rust Check

    runs-on: windows-latest


    # All Cargo commands in this job execute from:
    #
    #     app/src-tauri/
    #
    # This directory contains Cargo.toml and the Tauri Rust
    # backend source code.
    defaults:
      run:
        working-directory: app/src-tauri


    steps:


      # ======================================================
      # STEP 1 - CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # STEP 2 - VERIFY CARGO PROJECT
      # ======================================================
      #
      # Confirms that the Rust/Tauri project contains its
      # Cargo manifest.
      # ======================================================

      - name: Verify Cargo project
        shell: pwsh
        run: |

          Write-Host "============================================"
          Write-Host "Checking Rust/Tauri project"
          Write-Host "============================================"

          if (-not (Test-Path "Cargo.toml")) {

            Write-Error "ERROR: app/src-tauri/Cargo.toml was not found."

            exit 1
          }

          Write-Host "Cargo.toml found successfully."
          Write-Host ""


      # ======================================================
      # STEP 3 - SETUP STABLE RUST
      # ======================================================
      #
      # Installs the current stable Rust toolchain on the
      # temporary GitHub Actions Windows runner.
      #
      # Rust does not need to be preinstalled on the developer's
      # computer for this CI job to work.
      # ======================================================

      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable


      # ======================================================
      # STEP 4 - CHECK RUST / TAURI BACKEND
      # ======================================================
      #
      # cargo check:
      #
      # - Parses Rust source
      # - Resolves Rust dependencies
      # - Checks the Rust project
      # - Checks the Tauri backend compilation
      #
      # cargo check does NOT create:
      #
      # - Windows .exe
      # - Windows .msi
      # - NSIS installer
      #
      # The Windows release workflow handles the actual Tauri
      # application build.
      # ======================================================

      - name: Check Rust code
        run: cargo check


# ============================================================
# CI SUCCESS
# ============================================================
#
# When both jobs succeed:
#
#     Frontend Build     ✅
#     Rust Check         ✅
#
# the source code has passed CI validation.
#
#
# The separate Windows release workflow can then build:
#
#     React/Vite frontend
#             +
#       Rust/Tauri backend
#             ↓
#        Tauri Windows Build
#             ↓
#       NSIS Windows Installer
#             ↓
#              .exe
#
#
# ============================================================
# TROUBLESHOOTING
# ============================================================
#
#
# 1. package-lock.json JSON validation fails
#
# Error:
#
#     Invalid package-lock.json
#
# Fix locally:
#
#     cd app
#     Remove-Item package-lock.json -Force
#     npm install
#     npm ci
#
# Then commit the regenerated package-lock.json.
#
#
# 2. npm ci fails
#
# This normally means package.json and package-lock.json
# are not synchronized.
#
# Fix:
#
#     cd app
#     npm install
#     npm ci
#
# Then commit package.json and package-lock.json if npm
# changed either file.
#
#
# 3. npm run build fails
#
# Check:
#
#     app/package.json
#     app/src/
#     app/vite.config.*
#     app/tsconfig*.json
#
#
# 4. cargo check fails
#
# Check:
#
#     app/src-tauri/Cargo.toml
#     app/src-tauri/src/
#     Tauri configuration
#     Rust dependencies
#
#
# 5. dist/ verification fails
#
# Check whether:
#
#     npm run build
#
# successfully creates:
#
#     app/dist/
#
#
# ============================================================
# IMPORTANT DEVELOPMENT RULE
# ============================================================
#
# When changing npm dependencies:
#
#     cd app
#     npm install
#     npm ci
#     npm run build
#
# Then commit:
#
#     package.json
#     package-lock.json
#
# Never manually construct package-lock.json.
#
# npm should generate and maintain the lockfile.
#
# ============================================================

