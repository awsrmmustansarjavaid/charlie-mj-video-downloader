# ============================================================
# Charlie MJ Video Downloader - Continuous Integration
# ============================================================
#
# Purpose:
# - Validate the React/Vite frontend
# - Validate the Rust/Tauri backend
# - Run automatically on pushes to main
# - Run automatically for pull requests
# - Ensure the project is ready for the Windows release build
#
# IMPORTANT:
# - This workflow ONLY validates the project.
# - It does NOT create the Windows installer.
# - It does NOT create an .exe file.
#
# The Windows installer is created separately by:
#
#     .github/workflows/windows-release.yml
#
#
# CI PIPELINE:
#
# Developer
#     ↓
# Git Push / Pull Request
#     ↓
# GitHub Actions
#     ↓
# ┌───────────────────────────────┐
# │            CI                 │
# │                               │
# │  Frontend       Rust/Tauri    │
# │     │               │         │
# │     ↓               ↓         │
# │   npm ci         cargo check  │
# │     ↓               ↓         │
# │ npm build       Rust check    │
# └───────────────────────────────┘
#     ↓
# CI SUCCESS
#     ↓
# Windows Release Workflow
#     ↓
# Tauri Build
#     ↓
# Windows Installer (.exe)
#
# ============================================================


name: CI


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:

  # ----------------------------------------------------------
  # Run CI whenever changes are pushed to the main branch.
  #
  # This is the main validation path before the Windows
  # release workflow builds the application.
  # ----------------------------------------------------------

  push:
    branches:
      - main


  # ----------------------------------------------------------
  # Run CI whenever a pull request is opened or updated.
  #
  # This allows frontend and Rust problems to be detected
  # before changes are merged into main.
  # ----------------------------------------------------------

  pull_request:


# ============================================================
# JOBS
# ============================================================

jobs:


  # ==========================================================
  # FRONTEND BUILD
  # ==========================================================
  #
  # Purpose:
  #
  # Validate the React/Vite frontend.
  #
  # This job verifies:
  #
  # 1. Repository can be checked out
  # 2. Node.js can be configured
  # 3. package.json exists
  # 4. package-lock.json exists
  # 5. package-lock.json is a valid npm lockfile
  # 6. npm ci can install dependencies
  # 7. TypeScript can compile
  # 8. Vite can create the production frontend build
  #
  # IMPORTANT:
  #
  # npm ci intentionally requires a valid and synchronized
  # package-lock.json.
  #
  # package.json and package-lock.json must therefore be
  # committed together.
  #
  # If package.json is changed, package-lock.json must also
  # be regenerated and committed.
  #
  # This provides a reproducible dependency installation.
  # ==========================================================

  frontend:

    name: Frontend Build

    runs-on: windows-latest


    # --------------------------------------------------------
    # All shell commands in this job run from:
    #
    #     app/
    #
    # Therefore:
    #
    #     package.json
    #     package-lock.json
    #     vite.config.ts
    #     src/
    #
    # are referenced relative to the app directory.
    # --------------------------------------------------------

    defaults:
      run:
        working-directory: app


    steps:


      # ------------------------------------------------------
      # STEP 1 - Checkout repository
      # ------------------------------------------------------
      #
      # Downloads the current repository contents to the
      # GitHub Actions Windows runner.
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # STEP 2 - Setup Node.js
      # ------------------------------------------------------
      #
      # Node.js 22 is used for:
      #
      # - React
      # - TypeScript
      # - Vite
      # - npm
      # - Tauri CLI
      #
      # npm caching is enabled to speed up future builds.
      #
      # The cache uses:
      #
      #     app/package-lock.json
      #
      # as the dependency cache key.
      # ------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json


      # ------------------------------------------------------
      # STEP 3 - Verify package.json
      # ------------------------------------------------------
      #
      # Confirms that the frontend project contains the npm
      # package definition before attempting dependency
      # installation.
      # ------------------------------------------------------

      - name: Verify package.json
        shell: pwsh
        run: |

          Write-Host "============================================"
          Write-Host "Checking app/package.json"
          Write-Host "============================================"

          if (-not (Test-Path "package.json")) {

            Write-Error "app/package.json was not found."
            exit 1
          }

          Write-Host "package.json found successfully."
          Write-Host ""


      # ------------------------------------------------------
      # STEP 4 - Verify package-lock.json exists
      # ------------------------------------------------------
      #
      # npm ci requires a package-lock.json or npm-shrinkwrap
      # file.
      #
      # This check makes the error easier to understand if the
      # lockfile is missing.
      # ------------------------------------------------------

      - name: Verify package-lock.json exists
        shell: pwsh
        run: |

          Write-Host "============================================"
          Write-Host "Checking app/package-lock.json"
          Write-Host "============================================"

          if (-not (Test-Path "package-lock.json")) {

            Write-Error "app/package-lock.json was not found."
            Write-Error ""
            Write-Error "npm ci requires a committed package-lock.json."
            Write-Error "Generate a valid lockfile and commit it to the repository."

            exit 1
          }

          $lockFileSize = (Get-Item "package-lock.json").Length

          if ($lockFileSize -le 0) {

            Write-Error "app/package-lock.json is empty."
            exit 1
          }

          Write-Host "package-lock.json found successfully."
          Write-Host "Lockfile size: $lockFileSize bytes."
          Write-Host ""


      # ------------------------------------------------------
      # STEP 5 - Validate package-lock.json
      # ------------------------------------------------------
      #
      # This step checks that the lockfile is actually a valid
      # npm lockfile before running the full dependency
      # installation.
      #
      # The command:
      #
      #     npm install --package-lock-only
      #
      # is NOT used here because it could modify the lockfile.
      #
      # Instead, npm is asked to read the existing lockfile
      # information.
      #
      # npm ci itself remains the authoritative dependency
      # installation command.
      # ------------------------------------------------------

      - name: Validate npm lockfile
        shell: pwsh
        run: |

          Write-Host "============================================"
          Write-Host "Validating npm lockfile"
          Write-Host "============================================"

          $lockFile = Get-Content "package-lock.json" -Raw | ConvertFrom-Json

          if ($null -eq $lockFile.lockfileVersion) {

            Write-Error "package-lock.json does not contain lockfileVersion."
            Write-Error "The file is not a valid modern npm lockfile."

            exit 1
          }

          Write-Host "npm lockfileVersion: $($lockFile.lockfileVersion)"

          if ([int]$lockFile.lockfileVersion -lt 1) {

            Write-Error "Unsupported npm lockfileVersion."
            exit 1
          }

          Write-Host "package-lock.json structure is valid."
          Write-Host ""


      # ------------------------------------------------------
      # STEP 6 - Install frontend dependencies
      # ------------------------------------------------------
      #
      # npm ci performs a clean dependency installation based
      # strictly on package-lock.json.
      #
      # DO NOT replace this with:
      #
      #     npm install
      #
      # in the final CI workflow.
      #
      # npm ci provides:
      #
      # - Reproducible dependency versions
      # - Clean installation
      # - Faster CI installation
      # - Detection of package.json / lockfile mismatch
      #
      # If this step fails, fix package.json and
      # package-lock.json rather than bypassing npm ci.
      # ------------------------------------------------------

      - name: Install frontend dependencies
        run: npm ci


      # ------------------------------------------------------
      # STEP 7 - Build frontend
      # ------------------------------------------------------
      #
      # Runs the build command from package.json:
      #
      #     npm run build
      #
      # Which currently performs:
      #
      #     tsc -b
      #     vite build
      #
      # This confirms that the React/TypeScript/Vite frontend
      # can successfully compile for production.
      # ------------------------------------------------------

      - name: Build frontend
        run: npm run build


      # ------------------------------------------------------
      # STEP 8 - Verify frontend build output
      # ------------------------------------------------------
      #
      # Confirms that Vite actually created the production
      # output directory.
      #
      # This provides an additional validation layer after the
      # frontend build command succeeds.
      # ------------------------------------------------------

      - name: Verify frontend build output
        shell: pwsh
        run: |

          Write-Host "============================================"
          Write-Host "Checking frontend build output"
          Write-Host "============================================"

          if (-not (Test-Path "dist")) {

            Write-Error "Frontend build directory 'dist' was not created."
            Write-Error "The Vite production build may not have completed correctly."

            exit 1
          }

          Write-Host "Frontend build output found successfully."
          Write-Host ""


  # ==========================================================
  # RUST / TAURI BACKEND CHECK
  # ==========================================================
  #
  # Purpose:
  #
  # Validate the Rust/Tauri backend independently from the
  # frontend.
  #
  # This job verifies:
  #
  # 1. Repository can be checked out
  # 2. Stable Rust can be installed
  # 3. Cargo can resolve dependencies
  # 4. Rust source code can be checked
  # 5. The Tauri backend has no Rust compilation errors
  #
  # IMPORTANT:
  #
  # cargo check does NOT create:
  #
  # - Windows installer
  # - .exe
  # - .msi
  #
  # The actual Windows application is built separately by:
  #
  #     .github/workflows/windows-release.yml
  # ==========================================================

  rust:

    name: Rust Check

    runs-on: windows-latest


    # --------------------------------------------------------
    # All Cargo commands in this job run from:
    #
    #     app/src-tauri/
    #
    # This directory contains:
    #
    #     Cargo.toml
    #     src/
    #     Tauri configuration
    # --------------------------------------------------------

    defaults:
      run:
        working-directory: app/src-tauri


    steps:


      # ------------------------------------------------------
      # STEP 1 - Checkout repository
      # ------------------------------------------------------
      #
      # Downloads the repository source code to the GitHub
      # Actions Windows runner.
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # STEP 2 - Verify Cargo project
      # ------------------------------------------------------
      #
      # Confirms that Cargo.toml exists before attempting
      # to run cargo check.
      # ------------------------------------------------------

      - name: Verify Cargo project
        shell: pwsh
        run: |

          Write-Host "============================================"
          Write-Host "Checking Rust/Tauri project"
          Write-Host "============================================"

          if (-not (Test-Path "Cargo.toml")) {

            Write-Error "app/src-tauri/Cargo.toml was not found."
            exit 1
          }

          Write-Host "Cargo.toml found successfully."
          Write-Host ""


      # ------------------------------------------------------
      # STEP 3 - Setup stable Rust
      # ------------------------------------------------------
      #
      # GitHub Actions installs the stable Rust toolchain on
      # the temporary Windows runner.
      #
      # Rust and Cargo do NOT need to be installed locally on
      # your personal Windows PC for this workflow.
      # ------------------------------------------------------

      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable


      # ------------------------------------------------------
      # STEP 4 - Check Rust/Tauri backend
      # ------------------------------------------------------
      #
      # cargo check:
      #
      # - Parses the Rust project
      # - Resolves Rust dependencies
      # - Checks Rust source code
      # - Performs compilation checks
      # - Detects Rust/Tauri compilation problems
      #
      # It does NOT produce the final Windows installer.
      # ------------------------------------------------------

      - name: Check Rust code
        run: cargo check


# ============================================================
# END OF CI WORKFLOW
# ============================================================
#
# EXPECTED SUCCESSFUL PIPELINE
#
# Push to main
#     ↓
# GitHub Actions
#     ↓
# ┌─────────────────────────────────────────┐
# │                  CI                     │
# │                                         │
# │  Frontend Build       Rust Check        │
# │       │                   │             │
# │       ↓                   ↓             │
# │ package.json          Cargo.toml        │
# │       ↓                   ↓             │
# │ package-lock.json     Stable Rust       │
# │       ↓                   ↓             │
# │ npm ci                cargo check       │
# │       ↓                                 │
# │ npm run build                           │
# │       ↓                                 │
# │ frontend/dist                            │
# └─────────────────────────────────────────┘
#     ↓
# CI SUCCESS
#     ↓
# Windows Release Workflow
#     ↓
# npm ci
#     ↓
# npm run tauri build
#     ↓
# Tauri Windows Application
#     ↓
# NSIS Windows Installer
#     ↓
# .exe
#     ↓
# GitHub Actions Artifact
#
# ============================================================
#
# IMPORTANT:
#
# If CI fails at:
#
#     npm ci
#
# check:
#
#     app/package.json
#     app/package-lock.json
#
# They must be synchronized.
#
# If CI fails at:
#
#     cargo check
#
# check:
#
#     app/src-tauri/Cargo.toml
#     app/src-tauri/src/
#
# If CI succeeds:
#
#     Frontend Build       ✅
#     Rust Check           ✅
#
# then the project is ready for the separate Windows release
# workflow.
#
# ============================================================