# ============================================================
# Charlie MJ Video Downloader - Continuous Integration
# ============================================================
#
# Purpose:
# - Validate the React/Vite frontend
# - Validate the Rust/Tauri backend
# - Run automatically on pushes to main
# - Run automatically for pull requests
#
# IMPORTANT:
# - This workflow ONLY validates the application.
# - It does NOT create the Windows installer.
# - The Windows installer is created by:
#
#       .github/workflows/windows-release.yml
#
# CI FLOW:
#
# Developer
#     ↓
# Git Push / Pull Request
#     ↓
# CI
# ├── Frontend Build
# │   ├── Node.js 22
# │   ├── Verify package-lock.json
# │   ├── npm ci
# │   └── npm run build
# │
# └── Rust Check
#     ├── Stable Rust
#     └── cargo check
#
# Successful main branch:
#
# CI SUCCESS
#     ↓
# Windows Release
#     ↓
# Tauri Build
#     ↓
# Windows Installer (.exe)
#
# ============================================================


name: CI


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:

  # ----------------------------------------------------------
  # Run CI whenever code is pushed to the main branch.
  # ----------------------------------------------------------
  push:
    branches:
      - main

  # ----------------------------------------------------------
  # Run CI for pull requests targeting the repository.
  #
  # This allows frontend and Rust problems to be detected
  # before changes are merged into main.
  # ----------------------------------------------------------
  pull_request:


# ============================================================
# JOBS
# ============================================================

jobs:


  # ==========================================================
  # FRONTEND BUILD
  # ==========================================================
  #
  # This job validates the React/Vite frontend.
  #
  # Steps:
  #
  # 1. Checkout repository
  # 2. Setup Node.js 22
  # 3. Verify package.json
  # 4. Verify package-lock.json
  # 5. Install dependencies using npm ci
  # 6. Build the frontend
  #
  # IMPORTANT:
  #
  # npm ci requires a valid package-lock.json.
  #
  # package.json and package-lock.json must be synchronized.
  #
  # If they are not synchronized, npm ci intentionally fails.
  #
  # This is desirable because it prevents CI from silently
  # installing a different dependency tree.
  # ==========================================================

  frontend:
    name: Frontend Build
    runs-on: windows-latest

    # All shell commands below run from:
    #
    #     app/
    #
    defaults:
      run:
        working-directory: app

    steps:


      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      #
      # Downloads the repository source code to the GitHub
      # Actions Windows runner.
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      #
      # Node.js 22 is used for the React/Vite frontend and
      # Tauri CLI.
      #
      # npm dependency caching is enabled to speed up future
      # workflow executions.
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json


      # --------------------------------------------------------
      # Verify package.json
      # --------------------------------------------------------
      #
      # Confirms that the frontend project contains its
      # package definition before npm is executed.
      # --------------------------------------------------------

      - name: Verify package.json
        shell: pwsh
        run: |
          Write-Host "Checking app/package.json..."

          if (-not (Test-Path "package.json")) {
            Write-Error "app/package.json was not found."
            exit 1
          }

          Write-Host "package.json found successfully."


      # --------------------------------------------------------
      # Verify package-lock.json
      # --------------------------------------------------------
      #
      # npm ci cannot operate without a valid lockfile.
      #
      # The lockfile must be committed to GitHub together with
      # package.json.
      #
      # If this check fails, package-lock.json must be restored
      # or regenerated before CI can continue.
      # --------------------------------------------------------

      - name: Verify package-lock.json
        shell: pwsh
        run: |
          Write-Host "Checking app/package-lock.json..."

          if (-not (Test-Path "package-lock.json")) {
            Write-Error "app/package-lock.json was not found."
            Write-Error "npm ci requires a committed package-lock.json."
            exit 1
          }

          $lockFileSize = (Get-Item "package-lock.json").Length

          if ($lockFileSize -le 0) {
            Write-Error "app/package-lock.json is empty."
            exit 1
          }

          Write-Host "package-lock.json found."
          Write-Host "Lockfile size: $lockFileSize bytes."


      # --------------------------------------------------------
      # Install frontend dependencies
      # --------------------------------------------------------
      #
      # npm ci performs a clean installation based on the
      # dependency versions recorded in package-lock.json.
      #
      # DO NOT replace this with npm install in the final CI
      # workflow.
      #
      # npm ci gives us a predictable and reproducible CI build.
      # --------------------------------------------------------

      - name: Install frontend dependencies
        run: npm ci


      # --------------------------------------------------------
      # Build frontend application
      # --------------------------------------------------------
      #
      # package.json contains:
      #
      #     npm run build
      #
      # which executes:
      #
      #     tsc -b
      #     vite build
      #
      # This verifies that the React/TypeScript/Vite frontend
      # can successfully compile for production.
      # --------------------------------------------------------

      - name: Build frontend
        run: npm run build


  # ==========================================================
  # RUST / TAURI BACKEND CHECK
  # ==========================================================
  #
  # This job validates the Rust/Tauri backend.
  #
  # Steps:
  #
  # 1. Checkout repository
  # 2. Setup stable Rust
  # 3. Run cargo check
  #
  # IMPORTANT:
  #
  # cargo check validates the Rust project.
  #
  # It does NOT create the final Windows installer.
  #
  # The Windows installer is created by:
  #
  #     windows-release.yml
  # ==========================================================

  rust:
    name: Rust Check
    runs-on: windows-latest

    # All Cargo commands below run from:
    #
    #     app/src-tauri/
    #
    defaults:
      run:
        working-directory: app/src-tauri

    steps:


      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      #
      # Downloads the repository source code to the GitHub
      # Actions Windows runner.
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup stable Rust
      # --------------------------------------------------------
      #
      # Installs the stable Rust toolchain on the GitHub Actions
      # Windows runner.
      #
      # Rust and Cargo do NOT need to be installed on your PC
      # for this workflow.
      # --------------------------------------------------------

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable


      # --------------------------------------------------------
      # Check Rust/Tauri backend
      # --------------------------------------------------------
      #
      # cargo check:
      #
      # - Parses the Rust project
      # - Resolves Rust dependencies
      # - Checks Rust source code
      # - Detects compilation errors
      #
      # It does not create an installer.
      # --------------------------------------------------------

      - name: Check Rust code
        run: cargo check


# ============================================================
# END OF CI WORKFLOW
# ============================================================
#
# EXPECTED SUCCESSFUL PIPELINE
#
# Push to main
#     ↓
# CI
# ├── Frontend Build
# │   ├── Node.js 22
# │   ├── package.json       ✅
# │   ├── package-lock.json  ✅
# │   ├── npm ci              ✅
# │   └── npm run build       ✅
# │
# └── Rust Check
#     ├── Rust setup          ✅
#     └── cargo check         ✅
#
#             ↓
#
#        CI SUCCESS
#
#             ↓
#
# Windows Release
#             ↓
# npm run tauri build
#             ↓
# Tauri Windows Application
#             ↓
# NSIS Windows Installer
#             ↓
# .exe uploaded as GitHub Actions artifact
#
# ============================================================