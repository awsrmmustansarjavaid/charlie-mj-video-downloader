# ============================================================
# Charlie MJ Video Downloader - Windows Release
# ============================================================
# Purpose:
# - Build the complete Tauri Windows application
# - Generate the Windows installer (.exe)
# - Optionally generate the MSI installer
# - Upload installers to GitHub Actions artifacts
#
# This workflow can run in three ways:
#
# 1. MANUAL
#    GitHub → Actions → Windows Release → Run workflow
#
# 2. AUTOMATIC AFTER CI
#    Push to main
#        ↓
#    CI succeeds
#        ↓
#    Windows Release starts automatically
#
# 3. VERSION TAG
#    Example:
#
#    git tag v0.2.0
#    git push origin v0.2.0
#
#    The release workflow starts automatically.
#
# Output:
#
# app/src-tauri/target/release/bundle/nsis/*.exe
#
# The installer is uploaded as a GitHub Actions artifact.
# ============================================================

name: Windows Release


# ============================================================
# Workflow Triggers
# ============================================================

on:


  # ----------------------------------------------------------
  # Manual workflow trigger
  # ----------------------------------------------------------
  # Allows you to start the Windows build from:
  #
  # GitHub
  #   → Actions
  #   → Windows Release
  #   → Run workflow
  #
  # This is useful when you want to create an installer without
  # pushing a new commit or tag.
  # ----------------------------------------------------------
  workflow_dispatch:


  # ----------------------------------------------------------
  # Version tag trigger
  # ----------------------------------------------------------
  # Automatically starts the release when a version tag is
  # pushed.
  #
  # Examples:
  #
  # v0.2.0
  # v0.2.1
  # v1.0.0
  # ----------------------------------------------------------
  push:
    tags:
      - "v*"


  # ----------------------------------------------------------
  # Automatic trigger after CI
  # ----------------------------------------------------------
  # GitHub starts this workflow after another workflow finishes.
  #
  # The job below checks:
  #
  # - The completed workflow was "CI"
  # - CI completed successfully
  # - CI was running against the main branch
  #
  # This means a normal successful push to main can automatically
  # produce a Windows installer.
  # ----------------------------------------------------------
  workflow_run:
    workflows:
      - "CI"
    types:
      - completed
    branches:
      - "main"


# ============================================================
# Permissions
# ============================================================
# These permissions are sufficient for checking out the
# repository and uploading workflow artifacts.
# ============================================================

permissions:
  contents: read


# ============================================================
# Jobs
# ============================================================

jobs:


  # ==========================================================
  # Windows Build
  # ==========================================================
  build:
    name: Build Windows Installer
    runs-on: windows-latest


    # ----------------------------------------------------------
    # IMPORTANT
    # ----------------------------------------------------------
    # workflow_run also fires when CI fails.
    #
    # Therefore, this condition ensures that the Windows build
    # only runs when the CI workflow completed successfully.
    #
    # It also prevents pull-request CI runs from automatically
    # producing a Windows installer.
    # ----------------------------------------------------------
    if: >
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )


    steps:


      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      # Downloads the source code that will be compiled.
      #
      # For workflow_run events, use the exact commit that CI
      # validated rather than relying on the current branch tip.
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      # Node.js is required to install the React/Vite frontend
      # dependencies and run the Tauri CLI through npm.
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json


      # --------------------------------------------------------
      # Install frontend dependencies
      # --------------------------------------------------------
      # Uses the exact dependency versions from package-lock.json.
      #
      # This is important because npm ci provides reproducible
      # CI/release installations.
      # --------------------------------------------------------
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci


      # --------------------------------------------------------
      # Setup Rust
      # --------------------------------------------------------
      # Installs the stable Rust toolchain on the GitHub runner.
      #
      # No Rust installation is required on your local PC.
      # --------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable


      # --------------------------------------------------------
      # Build Windows Tauri application
      # --------------------------------------------------------
      # Runs the Tauri production build.
      #
      # This compiles:
      #
      # React frontend
      #       ↓
      # Tauri
      #       ↓
      # Rust backend
      #       ↓
      # Windows application
      #       ↓
      # NSIS installer
      #
      # The exact installer output depends on the Tauri
      # configuration.
      # --------------------------------------------------------
      - name: Build Windows installer
        working-directory: app
        run: npm run tauri build


      # --------------------------------------------------------
      # Display generated files
      # --------------------------------------------------------
      # Lists everything generated under the Tauri release
      # directory.
      #
      # This is useful for troubleshooting installer locations.
      # --------------------------------------------------------
      - name: Show generated Tauri files
        shell: pwsh
        run: |
          Write-Host "Checking Tauri release directory..."

          if (Test-Path "app/src-tauri/target/release") {

            Get-ChildItem `
              -Path "app/src-tauri/target/release" `
              -Recurse `
              -File |
              Select-Object FullName

          }
          else {

            Write-Error "Tauri release directory was not created."

          }


      # --------------------------------------------------------
      # Upload NSIS Windows installer
      # --------------------------------------------------------
      # Tauri normally places the NSIS installer under:
      #
      # app/src-tauri/target/release/bundle/nsis/
      #
      # The uploaded artifact can be downloaded from:
      #
      # GitHub
      #   → Actions
      #   → Windows Release
      #   → Successful run
      #   → Artifacts
      # --------------------------------------------------------
      - name: Upload Windows EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: charlie-mj-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error


      # --------------------------------------------------------
      # Upload MSI installer
      # --------------------------------------------------------
      # MSI packaging may not be enabled in every Tauri
      # configuration.
      #
      # Therefore, missing MSI files do not fail the workflow.
      # --------------------------------------------------------
      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: charlie-mj-windows-msi
          path: app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore