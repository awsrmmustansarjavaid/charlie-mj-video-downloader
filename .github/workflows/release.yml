name: Charlie MJ Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.1"
        required: true
        default: "v0.2.1"

permissions:
  contents: write

env:
  APP_DIR: app
  EXT_DIR: browser-extension
  TOOLS_DIR: app/src-tauri/resources/tools
  HOST_RESOURCE_DIR: app/src-tauri/resources/native-host

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }

          $version = $tag.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Release tag must look like v0.2.1"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native-host build dependency
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller

      - name: Install JavaScript dependencies
        working-directory: app
        run: npm ci

      - name: Prepare runtime directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:TOOLS_DIR" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:HOST_RESOURCE_DIR" | Out-Null

      - name: Download yt-dlp
        shell: pwsh
        run: |
          $url = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TOOLS_DIR\yt-dlp.exe"

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          $dir = "$env:RUNNER_TEMP\ffmpeg"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $bin = Get-ChildItem -Path $dir -Directory -Recurse | Where-Object { Test-Path (Join-Path $_.FullName "bin\ffmpeg.exe") } | Select-Object -First 1
          if (-not $bin) { throw "FFmpeg bin directory was not found." }
          Copy-Item (Join-Path $bin.FullName "bin\ffmpeg.exe") "$env:TOOLS_DIR\ffmpeg.exe"
          Copy-Item (Join-Path $bin.FullName "bin\ffprobe.exe") "$env:TOOLS_DIR\ffprobe.exe"

      - name: Verify runtime tools
        shell: pwsh
        run: |
          foreach ($file in @("yt-dlp.exe", "ffmpeg.exe", "ffprobe.exe")) {
            $path = Join-Path $env:TOOLS_DIR $file
            if (-not (Test-Path $path)) { throw "Missing runtime tool: $path" }
          }
          & "$env:TOOLS_DIR\yt-dlp.exe" --version
          & "$env:TOOLS_DIR\ffmpeg.exe" -version | Select-Object -First 1
          & "$env:TOOLS_DIR\ffprobe.exe" -version | Select-Object -First 1

      - name: Update extension version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $path = "$env:EXT_DIR\manifest.json"
          $manifest = Get-Content $path -Raw | ConvertFrom-Json
          $manifest.version = $env:VERSION
          $manifest | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding UTF8

      - name: Restore or generate CRX signing key (no OpenSSL)
        shell: pwsh
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CHARLIE_MJ_CRX_PRIVATE_KEY_B64 }}
        run: |
          $keyPath = "$env:RUNNER_TEMP\charlie-mj-extension.pem"

          if ([string]::IsNullOrWhiteSpace($env:CRX_PRIVATE_KEY_B64)) {
            Write-Warning "CHARLIE_MJ_CRX_PRIVATE_KEY_B64 is not configured. Generating a temporary CRX signing key with Node.js so the release does not fail."
            Write-Warning "For a stable Chrome extension ID across releases, configure CHARLIE_MJ_CRX_PRIVATE_KEY_B64 once. OpenSSL is not required."
            node scripts/generate-crx-key.js $keyPath
          } else {
            try {
              $bytes = [Convert]::FromBase64String($env:CRX_PRIVATE_KEY_B64)
            } catch {
              throw "CHARLIE_MJ_CRX_PRIVATE_KEY_B64 is not valid base64."
            }
            [IO.File]::WriteAllBytes($keyPath, $bytes)
          }

          if (-not (Test-Path $keyPath)) { throw "CRX signing key was not created." }
          if ((Get-Item $keyPath).Length -lt 100) { throw "CRX signing key is unexpectedly small." }
          $firstLine = (Get-Content $keyPath -TotalCount 1).Trim()
          if ($firstLine -notmatch '^-----BEGIN (RSA )?PRIVATE KEY-----$') {
            throw "CRX signing key does not look like a PEM private key."
          }

      - name: Calculate stable Chrome extension ID
        id: extension
        shell: pwsh
        run: |
          $id = node scripts/extension-id.js "$env:RUNNER_TEMP\charlie-mj-extension.pem"
          if ($id.Length -ne 32) { throw "Invalid extension ID: $id" }
          "id=$id" >> $env:GITHUB_OUTPUT
          Set-Content "$env:HOST_RESOURCE_DIR\extension-id.txt" $id -NoNewline
          Write-Host "Extension ID: $id"

      - name: Build Native Messaging host
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onefile `
            --name charlie-mj-native-host `
            --distpath "$env:RUNNER_TEMP\native-host-dist" `
            --workpath "$env:RUNNER_TEMP\native-host-build" `
            --specpath "$env:RUNNER_TEMP\native-host-spec" `
            native-host\host.py

          Copy-Item "$env:RUNNER_TEMP\native-host-dist\charlie-mj-native-host.exe" `
            "$env:HOST_RESOURCE_DIR\charlie-mj-native-host.exe"

      - name: Build and pack Chrome extension (CRX3, no Chrome/OpenSSL required)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zip = "$env:RUNNER_TEMP\Charlie-MJ-Video-Downloader-Chrome-Extension.zip"
          $crx = "$env:RUNNER_TEMP\Charlie-MJ-Video-Downloader-Chrome-Extension.crx"

          if (Test-Path $zip) { Remove-Item $zip -Force }
          if (Test-Path $crx) { Remove-Item $crx -Force }

          Compress-Archive -Path "$env:EXT_DIR\*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "Extension ZIP was not created." }

          node scripts/package-crx3.js `
            "$env:RUNNER_TEMP\charlie-mj-extension.pem" `
            $zip `
            $crx

          if (-not (Test-Path $crx)) { throw "CRX3 packer did not create the CRX file." }

          Copy-Item $crx "release\Charlie-MJ-Video-Downloader-Chrome-Extension.crx" -Force
          Copy-Item $zip "release\Charlie-MJ-Video-Downloader-Chrome-Extension.zip" -Force

          Write-Host "CRX3 package created without invoking Chrome."

      - name: Build Windows application
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Collect Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $setup = Get-ChildItem "app/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Tauri NSIS installer was not generated." }
          Copy-Item $setup.FullName "release\Charlie-MJ-Video-Downloader-Setup-x64.exe"

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release\SHA256SUMS.txt -Encoding UTF8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Charlie MJ Video Downloader ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release/Charlie-MJ-Video-Downloader-Setup-x64.exe
            release/Charlie-MJ-Video-Downloader-Chrome-Extension.crx
            release/Charlie-MJ-Video-Downloader-Chrome-Extension.zip
            release/SHA256SUMS.txt
