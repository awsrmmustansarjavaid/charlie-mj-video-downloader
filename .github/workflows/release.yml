# ============================================================
# Charlie MJ Video Downloader - Windows Release
# ============================================================
# Purpose:
# - Build the complete Tauri Windows application
# - Generate the Windows installer (.exe)
# - Upload the installer to GitHub Actions artifacts
#
# How to run:
#
# 1. Manually:
#    GitHub → Actions → Windows Release → Run workflow
#
# 2. Automatically:
#    Push a Git tag such as:
#    v0.2.0
#
# Example:
#    git tag v0.2.0
#    git push origin v0.2.0
#
# The generated installer will be available under:
#
# GitHub → Actions → Windows Release → Run → Artifacts
# ============================================================

name: Windows Release

on:

  # ----------------------------------------------------------
  # Allow manual execution from GitHub Actions
  # ----------------------------------------------------------
  workflow_dispatch:

  # ----------------------------------------------------------
  # Automatically build when a version tag is pushed
  #
  # Example:
  # v0.2.0
  # v0.2.1
  # v1.0.0
  # ----------------------------------------------------------
  push:
    tags:
      - "v*"


jobs:

  # ==========================================================
  # Windows Build
  # ==========================================================
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json


      # --------------------------------------------------------
      # Install frontend dependencies
      #
      # npm ci is preferred for CI because it uses the exact
      # versions stored in package-lock.json.
      # --------------------------------------------------------
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci


      # --------------------------------------------------------
      # Install Rust
      #
      # Tauri requires Rust to compile the native Windows app.
      # --------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable


      # --------------------------------------------------------
      # Build the Tauri Windows application
      #
      # npm run tauri build should call the Tauri CLI and create
      # the production Windows application and installer.
      # --------------------------------------------------------
      - name: Build Windows installer
        working-directory: app
        run: npm run tauri build


      # --------------------------------------------------------
      # Show generated files
      #
      # This makes troubleshooting much easier if the .exe
      # path changes or the bundler creates another package.
      # --------------------------------------------------------
      - name: Show generated Tauri files
        shell: pwsh
        run: |
          Write-Host "Checking Tauri release directory..."

          if (Test-Path "app/src-tauri/target/release") {
            Get-ChildItem `
              -Path "app/src-tauri/target/release" `
              -Recurse `
              -File |
              Select-Object FullName
          }
          else {
            Write-Error "Tauri release directory was not created."
          }


      # --------------------------------------------------------
      # Upload Windows EXE installer
      #
      # Tauri NSIS normally creates the Windows installer here:
      #
      # app/src-tauri/target/release/bundle/nsis/*.exe
      # --------------------------------------------------------
      - name: Upload Windows EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: charlie-mj-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error


      # --------------------------------------------------------
      # Upload MSI installer if Tauri generates one
      #
      # This is optional but useful if your Tauri configuration
      # enables MSI packaging.
      # --------------------------------------------------------
      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: charlie-mj-windows-msi
          path: app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore