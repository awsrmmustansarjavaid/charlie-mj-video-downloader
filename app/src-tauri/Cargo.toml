# ============================================================
# Charlie MJ Video Downloader - Rust/Tauri Package
# ============================================================
# This Cargo manifest defines the Rust backend package for the
# Charlie MJ Video Downloader desktop application.
#
# Application architecture:
#
# React + TypeScript frontend
#          ↓
#        Tauri
#          ↓
#    Rust application
#          ↓
# ┌────────┼─────────────────────────────┐
# │        │                             │
# SQLite  Downloader                  FFmpeg
# │        │                             │
# └────────┴──────────────┬──────────────┘
#                         ↓
#                Windows Desktop App
#
# Cargo uses this file to:
# - Identify the Rust package
# - Define the Rust library crate
# - Configure Tauri build support
# - Configure Tauri runtime dependencies
# - Configure application libraries
#
# IMPORTANT:
# This is a normal Cargo package manifest.
# It is NOT a virtual workspace manifest.
#
# Therefore, [package] is required and no [workspace] section
# is defined in this file.
#
# Tauri version compatibility:
#
# The frontend uses:
#   @tauri-apps/api = 2.11.5
#   @tauri-apps/cli = 2.11.5
#
# The Rust Tauri framework and official plugins are therefore
# aligned to the same 2.11.x release family.
#
# Keeping the frontend and Rust Tauri versions aligned prevents
# the Tauri CLI from stopping the production build because of
# mismatched major/minor versions.
# ============================================================


# ============================================================
# Package Configuration
# ============================================================
# The [package] section identifies this Cargo package.
#
# Cargo treats this as an actual Rust package/crate rather than
# a virtual workspace.

[package]


# ------------------------------------------------------------
# Package Name
# ------------------------------------------------------------
# Name of the Rust package.
#
# This name identifies the backend package within Cargo.
name = "charlie-mj-video-downloader"


# ------------------------------------------------------------
# Application Version
# ------------------------------------------------------------
# Current application version.
#
# This should remain synchronized with the application release
# version used by the desktop application and release process.
version = "0.2.0"


# ------------------------------------------------------------
# Package Description
# ------------------------------------------------------------
# Short description of the application.
description = "Charlie MJ Video Downloader"


# ------------------------------------------------------------
# Package Authors
# ------------------------------------------------------------
# Maintainer/contributor information.
authors = ["Charlie MJ contributors"]


# ------------------------------------------------------------
# Rust Edition
# ------------------------------------------------------------
# Rust 2021 edition.
#
# The edition controls Rust language conventions and compiler
# behavior used by this package.
edition = "2021"


# ============================================================
# Library Configuration
# ============================================================
# Tauri uses the library crate for the application's main Rust
# application logic.
#
# The executable entry point is:
#
#   app/src-tauri/src/main.rs
#
# The main Tauri application setup is implemented through:
#
#   app/src-tauri/src/lib.rs
#
# The library name uses underscores because Rust crate names
# used in source code follow Rust's identifier conventions.

[lib]


# ------------------------------------------------------------
# Library Name
# ------------------------------------------------------------
# Rust library crate name.
#
# The package itself uses the hyphenated Cargo package name,
# while the library uses an underscore-based Rust identifier.
name = "charlie_mj_video_downloader_lib"


# ------------------------------------------------------------
# Library Output Types
# ------------------------------------------------------------
# Output formats required by the Tauri application.
#
# staticlib:
#   Produces a static library.
#
# cdylib:
#   Produces a C-compatible dynamic library.
#
# rlib:
#   Produces the standard Rust library format.
#
# These formats support the Tauri build and Rust compilation
# process.
crate-type = ["staticlib", "cdylib", "rlib"]


# ============================================================
# Build Dependencies
# ============================================================
# Dependencies required while Cargo builds the application.
#
# Build dependencies are compiled for the build process and
# are separate from normal runtime dependencies.

[build-dependencies]


# ------------------------------------------------------------
# Tauri Build Support
# ------------------------------------------------------------
# Tauri build-time integration.
#
# This works with:
#
#   app/src-tauri/build.rs
#
# where the build script invokes:
#
#   tauri_build::build()
#
# Version 2.11.5 is intentionally aligned with the Tauri runtime
# dependency below.
tauri-build = { version = "2.11.5", features = [] }


# ============================================================
# Runtime / Application Dependencies
# ============================================================
# Dependencies compiled into the Rust/Tauri application.
#
# These libraries provide the desktop framework, filesystem
# access, dialogs, notifications, serialization, networking,
# database functionality, asynchronous processing, and other
# backend functionality used by the application.

[dependencies]


# ============================================================
# Tauri Framework
# ============================================================
# Main framework connecting the React frontend with the Rust
# desktop backend.
#
# tray-icon:
#   Enables system-tray functionality.
#
# The Tauri Rust version is aligned with the frontend Tauri
# packages:
#
#   @tauri-apps/api  = 2.11.5
#   @tauri-apps/cli  = 2.11.5
#
# This alignment prevents the Tauri CLI from reporting a
# major/minor version mismatch during:
#
#   npm run tauri build
tauri = { version = "2.11.5", features = ["tray-icon"] }


# ============================================================
# Tauri Dialog Plugin
# ============================================================
# Provides native desktop dialog functionality.
#
# Typical uses include:
# - File selection
# - Folder selection
# - Confirmation dialogs
# - Native application dialogs
#
# Version is aligned with the Tauri 2.11.x release family.
tauri-plugin-dialog = "2.11.5"


# ============================================================
# Tauri File System Plugin
# ============================================================
# Provides controlled filesystem functionality for the Tauri
# application.
#
# Typical uses include:
# - Reading files
# - Writing files
# - Selecting download locations
# - Managing application files
# - Working with local application data
#
# Version is aligned with the Tauri 2.11.x release family.
tauri-plugin-fs = "2.11.5"


# ============================================================
# Tauri Notification Plugin
# ============================================================
# Provides native desktop notification functionality.
#
# Example application events:
# - Download started
# - Download completed
# - Download failed
# - Other application notifications
#
# Version is aligned with the Tauri 2.11.x release family.
tauri-plugin-notification = "2.11.5"


# ============================================================
# Serde
# ============================================================
# Serialization and deserialization framework for Rust.
#
# derive:
#   Enables automatic generation of Serialize and Deserialize
#   implementations.
#
# Used for application data models and structured communication
# between the Rust backend and frontend.
serde = { version = "1", features = ["derive"] }


# ============================================================
# Serde JSON
# ============================================================
# JSON serialization and deserialization.
#
# Used for structured data exchanged between:
# - React frontend
# - Rust backend
# - Application components
# - Browser/media capture data
serde_json = "1"


# ============================================================
# Tokio
# ============================================================
# Asynchronous runtime used by the Rust backend.
#
# Used for asynchronous operations such as:
# - Downloads
# - Networking
# - External processes
# - Background tasks
# - Timers
# - Synchronization
#
# Enabled features:
#
# process:
#   Start and manage external processes such as FFmpeg.
#
# sync:
#   Provides synchronization primitives.
#
# rt-multi-thread:
#   Enables the multi-threaded Tokio runtime.
#
# macros:
#   Provides Tokio helper macros.
#
# time:
#   Provides asynchronous timers and delays.
#
# net:
#   Provides asynchronous networking functionality.
#
# io-util:
#   Provides asynchronous I/O utilities.
tokio = {
    version = "1",
    features = [
        "process",
        "sync",
        "rt-multi-thread",
        "macros",
        "time",
        "net",
        "io-util"
    ]
}


# ============================================================
# UUID
# ============================================================
# Generates unique identifiers for application objects.
#
# v4:
#   Enables randomly generated UUID version 4 values.
#
# serde:
#   Enables serialization/deserialization support.
#
# Potential uses:
# - Download job IDs
# - Browser capture IDs
# - Stream IDs
# - Application records
uuid = { version = "1", features = ["v4", "serde"] }


# ============================================================
# Rusqlite
# ============================================================
# Rust interface for SQLite.
#
# bundled:
#   Compiles SQLite together with the application so a separate
#   system SQLite installation is not required.
#
# Potential application data:
# - Download history
# - Browser capture records
# - Application settings
# - Download metadata
rusqlite = { version = "0.32", features = ["bundled"] }


# ============================================================
# URL
# ============================================================
# URL parsing and manipulation library.
#
# Used for:
# - HTTP/HTTPS URL validation
# - Reading URL components
# - Processing media URLs
# - Normalizing captured stream URLs
url = "2"


# ============================================================
# Chrono
# ============================================================
# Date and time library for Rust.
#
# serde:
#   Enables serialization and deserialization support.
#
# Used for timestamps such as:
# - Download creation time
# - Browser capture creation time
# - Application history timestamps
chrono = { version = "0.4", features = ["serde"] }


# ============================================================
# Thiserror
# ============================================================
# Provides utilities for creating structured application
# specific error types.
#
# Useful when backend modules need clear and maintainable
# error handling.
thiserror = "2"


# ============================================================
# Reqwest
# ============================================================
# HTTP client used for network requests and direct media
# stream downloads.
#
# default-features = false:
#   Disables Reqwest's default feature set so the application
#   explicitly controls the enabled functionality.
#
# rustls-tls:
#   Provides HTTPS/TLS support using Rustls.
#
# stream:
#   Enables streaming HTTP response bodies.
#
# Streaming allows large downloads to be processed in chunks
# instead of loading the entire response into memory.
reqwest = {
    version = "0.12",
    default-features = false,
    features = [
        "rustls-tls",
        "stream"
    ]
}


# ============================================================
# Futures Util
# ============================================================
# Utilities for working with Rust Futures and asynchronous
# streams.
#
# Used together with Tokio and Reqwest for streaming download
# operations.
futures-util = "0.3"


# ============================================================
# SHA-256
# ============================================================
# Provides SHA-2 cryptographic hashing algorithms.
#
# SHA-256 can be used for:
# - File integrity verification
# - Download verification
# - Content hashing
# - Comparing downloaded files
sha2 = "0.10"


# ============================================================
# Hex Encoding
# ============================================================
# Converts binary data into hexadecimal strings and converts
# hexadecimal strings back into binary data.
#
# Useful for displaying binary hash values such as SHA-256 in
# a readable hexadecimal representation.
hex = "0.4"
