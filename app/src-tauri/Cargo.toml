[package]
name = "charlie-mj-video-downloader"
version = "0.1.0"
description = "Charlie MJ Video Downloader"
authors = ["Charlie MJ contributors"]
edition = "2021"

[lib]
name = "charlie_mj_video_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0" }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-notification = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
