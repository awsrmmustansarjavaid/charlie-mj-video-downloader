# ============================================================
# Charlie MJ Video Downloader - Rust/Tauri Package
# ============================================================
# This Cargo manifest defines the Rust package used by the
# Tauri desktop application.
#
# Cargo uses this file to:
# - Identify the Rust package
# - Define the library crate
# - Configure build-time dependencies
# - Configure runtime dependencies
# - Provide dependency features required by the application
#
# Application architecture:
#
# React + TypeScript
#        ↓
#      Tauri
#        ↓
#   Rust Application
#        ↓
# ┌──────┼──────────────────────────┐
# │      │                          │
# SQLite Downloader             FFmpeg
# │      │                          │
# └──────┴──────────────┬───────────┘
#                       ↓
#              Windows Desktop App
#
# IMPORTANT:
# This is a normal Cargo package manifest.
# It is NOT a virtual workspace manifest.
#
# Therefore, this file must contain [package].
# A [workspace] section is intentionally not defined here.
# ============================================================


# ============================================================
# Package Configuration
# ============================================================
# The [package] section identifies this Cargo package.
#
# This section is required for a normal Rust package and tells
# Cargo that this Cargo.toml represents an actual package/crate
# rather than a virtual workspace manifest.

[package]


# ------------------------------------------------------------
# Package Name
# ------------------------------------------------------------
# Unique name of the Rust package.
#
# Cargo uses this name when compiling and identifying the
# application package.
name = "charlie-mj-video-downloader"


# ------------------------------------------------------------
# Application Version
# ------------------------------------------------------------
# Current application/package version.
#
# This version can also be used when preparing releases and
# Windows installers.
version = "0.2.0"


# ------------------------------------------------------------
# Package Description
# ------------------------------------------------------------
# Short description of the Charlie MJ desktop application.
description = "Charlie MJ Video Downloader"


# ------------------------------------------------------------
# Package Authors
# ------------------------------------------------------------
# Maintainer/contributor information for the Rust package.
authors = ["Charlie MJ contributors"]


# ------------------------------------------------------------
# Rust Edition
# ------------------------------------------------------------
# Rust 2021 edition.
#
# The edition controls Rust language conventions and compiler
# behavior used by the project.
edition = "2021"


# ============================================================
# Library Configuration
# ============================================================
# The Tauri application uses a library crate for the main
# application logic.
#
# The executable entry point is kept in:
#
# app/src-tauri/src/main.rs
#
# The main application setup and Tauri backend are provided
# through:
#
# app/src-tauri/src/lib.rs

[lib]


# ------------------------------------------------------------
# Library Name
# ------------------------------------------------------------
# Name of the Rust library crate.
#
# The underscore-based name is intentional because Rust crate
# names cannot use the same hyphenated form used by the package
# name in source-code references.
name = "charlie_mj_video_downloader_lib"


# ------------------------------------------------------------
# Library Output Types
# ------------------------------------------------------------
# Defines the library formats Cargo should produce.
#
# staticlib:
#   Produces a static library.
#
# cdylib:
#   Produces a C-compatible dynamic library.
#
# rlib:
#   Produces the standard Rust library format used by Rust
#   crates.
#
# These formats are used by the Tauri build configuration and
# Rust compilation process.
crate-type = ["staticlib", "cdylib", "rlib"]


# ============================================================
# Build Dependencies
# ============================================================
# Dependencies in this section are used while Cargo builds
# the application.
#
# They are separate from normal runtime dependencies because
# they are required by the build process itself.

[build-dependencies]


# ------------------------------------------------------------
# Tauri Build Support
# ------------------------------------------------------------
# Provides Tauri-specific build-time functionality.
#
# This works with:
#
# app/src-tauri/build.rs
#
# The build script calls:
#
# tauri_build::build()
#
# to perform Tauri build preparation and configuration.
tauri-build = { version = "2.0.0" }


# ============================================================
# Runtime / Application Dependencies
# ============================================================
# Libraries in this section are compiled into the application
# and provide functionality required by the Rust/Tauri backend.

[dependencies]


# ------------------------------------------------------------
# Tauri Framework
# ------------------------------------------------------------
# Main framework connecting the web frontend with the Rust
# desktop backend.
#
# tray-icon:
#   Enables system-tray functionality.
#
# This allows the application to support desktop features such
# as a system-tray icon and tray menu.
tauri = { version = "2.0.0", features = ["tray-icon"] }


# ------------------------------------------------------------
# Tauri Dialog Plugin
# ------------------------------------------------------------
# Provides native desktop dialog functionality.
#
# Can be used for:
# - File selection
# - Folder selection
# - Confirmation dialogs
# - Native application dialogs
tauri-plugin-dialog = "2.0.0"


# ------------------------------------------------------------
# Tauri File System Plugin
# ------------------------------------------------------------
# Provides controlled filesystem functionality for the Tauri
# application.
#
# Useful for:
# - Reading files
# - Writing files
# - Selecting download locations
# - Managing application files
# - Working with local application data
tauri-plugin-fs = "2.0.0"


# ------------------------------------------------------------
# Tauri Notification Plugin
# ------------------------------------------------------------
# Provides desktop notification functionality.
#
# The application can use notifications for events such as:
# - Download started
# - Download completed
# - Download failed
# - Other application events
tauri-plugin-notification = "2.0.0"


# ------------------------------------------------------------
# Serde
# ------------------------------------------------------------
# Serialization and deserialization framework for Rust.
#
# derive:
#   Enables automatic generation of Serialize and Deserialize
#   implementations.
#
# Used by the application's data models when exchanging
# structured data between Rust and the frontend.
serde = { version = "1", features = ["derive"] }


# ------------------------------------------------------------
# Serde JSON
# ------------------------------------------------------------
# Provides JSON serialization and deserialization.
#
# Used for communication and data processing between:
# - React frontend
# - Rust backend
# - Chrome/native messaging components
# - Browser media capture data
serde_json = "1"


# ------------------------------------------------------------
# Tokio
# ------------------------------------------------------------
# Asynchronous runtime used by the Rust backend.
#
# The application uses Tokio for asynchronous operations such
# as downloads, networking, external processes, and background
# tasks.
#
# Enabled features:
#
# process:
#   Allows the application to start and manage external
#   processes such as FFmpeg.
#
# sync:
#   Provides synchronization primitives used by shared state.
#
# rt-multi-thread:
#   Enables Tokio's multi-threaded runtime.
#
# macros:
#   Provides Tokio helper macros.
#
# time:
#   Provides asynchronous timers and delays.
#
# net:
#   Provides asynchronous networking functionality.
#
# io-util:
#   Provides asynchronous I/O utilities.
tokio = {
    version = "1",
    features = [
        "process",
        "sync",
        "rt-multi-thread",
        "macros",
        "time",
        "net",
        "io-util"
    ]
}


# ------------------------------------------------------------
# UUID
# ------------------------------------------------------------
# Generates unique identifiers for application objects.
#
# v4:
#   Enables randomly generated UUID version 4 values.
#
# serde:
#   Enables serialization and deserialization support.
#
# UUIDs can be used for:
# - Download job IDs
# - Browser capture IDs
# - Stream IDs
# - Other application records
uuid = { version = "1", features = ["v4", "serde"] }


# ------------------------------------------------------------
# Rusqlite
# ------------------------------------------------------------
# Rust interface for SQLite.
#
# bundled:
#   Compiles SQLite together with the application instead of
#   requiring a separately installed SQLite library.
#
# The application uses SQLite for local data such as:
# - Download history
# - Browser capture records
# - Application settings
# - Download metadata
rusqlite = { version = "0.32", features = ["bundled"] }


# ------------------------------------------------------------
# URL
# ------------------------------------------------------------
# Provides URL parsing and manipulation.
#
# Used for:
# - HTTP/HTTPS URL validation
# - Reading URL components
# - Processing media URLs
# - Normalizing captured stream URLs
url = "2"


# ------------------------------------------------------------
# Chrono
# ------------------------------------------------------------
# Date and time library for Rust.
#
# serde:
#   Enables serialization and deserialization support.
#
# Used for timestamps such as:
# - Download creation time
# - Browser capture creation time
# - Application history timestamps
chrono = { version = "0.4", features = ["serde"] }


# ------------------------------------------------------------
# Thiserror
# ------------------------------------------------------------
# Provides utilities for creating structured custom error
# types in Rust.
#
# This is useful when backend modules need clear and
# application-specific error handling.
thiserror = "2"


# ------------------------------------------------------------
# Reqwest
# ------------------------------------------------------------
# HTTP client used for network requests and direct media
# stream downloads.
#
# default-features = false:
#   Disables Reqwest's default feature set so that only the
#   required functionality is enabled.
#
# rustls-tls:
#   Enables HTTPS/TLS support using Rustls.
#
# stream:
#   Enables streaming HTTP response bodies.
#
# Streaming allows large video/audio responses to be processed
# in chunks instead of loading the entire file into memory.
reqwest = {
    version = "0.12",
    default-features = false,
    features = [
        "rustls-tls",
        "stream"
    ]
}


# ------------------------------------------------------------
# Futures Util
# ------------------------------------------------------------
# Provides utilities for working with Rust Futures and
# asynchronous streams.
#
# Used together with Tokio and Reqwest when processing
# streaming download responses.
futures-util = "0.3"


# ------------------------------------------------------------
# SHA-256
# ------------------------------------------------------------
# Provides SHA-2 cryptographic hashing algorithms.
#
# SHA-256 can be used for:
# - File integrity verification
# - Download verification
# - Content hashing
# - Comparing downloaded files
sha2 = "0.10"


# ------------------------------------------------------------
# Hex Encoding
# ------------------------------------------------------------
# Converts binary data into hexadecimal strings and back.
#
# Useful for representing binary hash values, such as SHA-256,
# as readable hexadecimal strings.
hex = "0.4"