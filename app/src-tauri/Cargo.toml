# ============================================================
# Charlie MJ Video Downloader - Rust/Tauri Package
# ============================================================
# This file defines the Rust package configuration for the
# Charlie MJ Video Downloader desktop application.
#
# Cargo uses this file to:
# - Identify the application
# - Configure the Rust library
# - Define build dependencies
# - Define application dependencies
# - Configure Tauri
# - Configure required Rust features
#
# Main architecture:
#
# React + TypeScript
#        ↓
#      Tauri
#        ↓
#   Rust Backend
#        ↓
# ┌──────┴─────────────────────┐
# │                            │
# SQLite                   Downloader
# Database                 Processes
# │                            │
# └──────────────┬─────────────┘
#                ↓
#          Windows Desktop App
# ============================================================


# ============================================================
# Package Information
# ============================================================

# Unique package/crate name.
#
# This name is used by Cargo when building the Rust project.
name = "charlie-mj-video-downloader"


# Current application version.
#
# This version can also be used when creating application
# releases and installers.
version = "0.2.0"


# Short description of the application.
description = "Charlie MJ Video Downloader"


# Package authors.
authors = ["Charlie MJ contributors"]


# Rust edition used by this project.
#
# Edition 2021 provides the Rust language features and
# conventions used by this application.
edition = "2021"


# ============================================================
# Library Configuration
# ============================================================
# Defines the Rust library produced by this package.
#
# Tauri applications commonly use a library crate so that
# the application logic can be organized separately from
# the executable entry point.

[lib]

# Name of the generated Rust library.
name = "charlie_mj_video_downloader_lib"


# ------------------------------------------------------------
# Library Output Types
# ------------------------------------------------------------
# staticlib:
#   Builds a static library.
#
# cdylib:
#   Builds a C-compatible dynamic library.
#
# rlib:
#   Standard Rust library format used by Rust crates.
#
# These output types provide the formats required by the
# Tauri build system and Rust tooling.
crate-type = ["staticlib", "cdylib", "rlib"]


# ============================================================
# Build Dependencies
# ============================================================
# Dependencies in this section are used during the build
# process rather than by the application at runtime.

[build-dependencies]


# ------------------------------------------------------------
# Tauri Build Support
# ------------------------------------------------------------
# Provides Tauri's build-time functionality.
#
# This works together with:
# app/src-tauri/build.rs
#
# The build script calls:
#
# tauri_build::build()
#
# to perform Tauri-specific build preparation.
tauri-build = { version = "2.0.0" }


# ============================================================
# Application Dependencies
# ============================================================
# These libraries are compiled into the Charlie MJ application
# and provide the functionality required by the Rust backend.

[dependencies]


# ------------------------------------------------------------
# Tauri Framework
# ------------------------------------------------------------
# Main framework used to build the Windows desktop application
# with a web frontend and Rust backend.
#
# tray-icon:
#   Enables system tray functionality.
#
# This allows Charlie MJ to provide desktop features such as
# a system tray icon/menu.
tauri = { version = "2.0.0", features = ["tray-icon"] }


# ------------------------------------------------------------
# Tauri Dialog Plugin
# ------------------------------------------------------------
# Provides native desktop dialogs.
#
# Can be used for things such as:
# - File selection
# - Folder selection
# - Confirmation dialogs
# - Native message dialogs
tauri-plugin-dialog = "2.0.0"


# ------------------------------------------------------------
# Tauri File System Plugin
# ------------------------------------------------------------
# Provides controlled filesystem access from the Tauri
# application.
#
# Useful for:
# - Reading files
# - Writing files
# - Managing download locations
# - Working with application data
tauri-plugin-fs = "2.0.0"


# ------------------------------------------------------------
# Tauri Notification Plugin
# ------------------------------------------------------------
# Provides desktop notifications.
#
# Charlie MJ can use this for events such as:
# - Download started
# - Download completed
# - Download failed
# - Other application notifications
tauri-plugin-notification = "2.0.0"


# ------------------------------------------------------------
# Serde
# ------------------------------------------------------------
# Serialization and deserialization framework for Rust.
#
# derive:
#   Enables automatic generation of Serialize and Deserialize
#   implementations.
#
# Useful for converting Rust structures to/from JSON and
# communicating with the React frontend.
serde = { version = "1", features = ["derive"] }


# ------------------------------------------------------------
# Serde JSON
# ------------------------------------------------------------
# Provides JSON serialization and deserialization.
#
# Used when exchanging structured data between:
# - React frontend
# - Rust backend
# - Native messaging host
# - Downloader processes
serde_json = "1"


# ------------------------------------------------------------
# Tokio
# ------------------------------------------------------------
# Asynchronous runtime for Rust.
#
# Used for handling asynchronous and concurrent operations
# such as downloads, processes, networking, and application
# tasks.
#
# Enabled features:
#
# process:
#   Start and manage external processes.
#
# sync:
#   Synchronization primitives for asynchronous tasks.
#
# rt-multi-thread:
#   Multi-threaded asynchronous runtime.
#
# macros:
#   Provides Tokio macros such as #[tokio::main].
#
# time:
#   Timers and delays.
#
# net:
#   Asynchronous networking functionality.
#
# io-util:
#   Asynchronous I/O utilities.
tokio = {
    version = "1",
    features = [
        "process",
        "sync",
        "rt-multi-thread",
        "macros",
        "time",
        "net",
        "io-util"
    ]
}


# ------------------------------------------------------------
# UUID
# ------------------------------------------------------------
# Generates and manages unique identifiers.
#
# v4:
#   Enables randomly generated UUIDs.
#
# serde:
#   Allows UUID values to be serialized/deserialized.
#
# Useful for uniquely identifying downloads, jobs, or other
# application records.
uuid = { version = "1", features = ["v4", "serde"] }


# ------------------------------------------------------------
# Rusqlite
# ------------------------------------------------------------
# Rust interface for SQLite databases.
#
# bundled:
#   Builds and includes SQLite with the application instead
#   of depending on a separately installed SQLite library.
#
# Useful for storing local application data such as:
# - Download history
# - Download metadata
# - Application records
rusqlite = { version = "0.32", features = ["bundled"] }


# ------------------------------------------------------------
# URL
# ------------------------------------------------------------
# Provides URL parsing and manipulation functionality.
#
# Useful for:
# - Validating URLs
# - Reading query parameters
# - Processing media URLs
# - Handling download URLs
url = "2"


# ------------------------------------------------------------
# Chrono
# ------------------------------------------------------------
# Date and time library for Rust.
#
# serde:
#   Allows date/time values to be serialized and
#   deserialized.
#
# Useful for storing:
# - Download timestamps
# - Created/updated times
# - History dates
chrono = { version = "0.4", features = ["serde"] }


# ------------------------------------------------------------
# Thiserror
# ------------------------------------------------------------
# Provides convenient custom error types for Rust.
#
# It helps create readable and structured application errors
# that can be returned from backend functions.
thiserror = "2"


# ------------------------------------------------------------
# Reqwest
# ------------------------------------------------------------
# HTTP client used for network requests and downloading data.
#
# default-features = false:
#   Disables Reqwest's default feature set so only the required
#   functionality is enabled.
#
# rustls-tls:
#   Provides TLS/HTTPS support using Rustls.
#
# stream:
#   Enables streaming HTTP response bodies.
#
# Streaming is particularly useful for large video/audio
# downloads because the entire file does not need to be loaded
# into memory at once.
reqwest = {
    version = "0.12",
    default-features = false,
    features = [
        "rustls-tls",
        "stream"
    ]
}


# ------------------------------------------------------------
# Futures Util
# ------------------------------------------------------------
# Provides utilities for working with Rust Futures and
# asynchronous streams.
#
# Useful together with Tokio and Reqwest for processing
# streaming download data.
futures-util = "0.3"


# ------------------------------------------------------------
# SHA-256 Hashing
# ------------------------------------------------------------
# Provides SHA-2 cryptographic hashing algorithms.
#
# SHA-256 can be used for:
# - File integrity checks
# - Download verification
# - Generating content hashes
# - Comparing downloaded data
sha2 = "0.10"


# ------------------------------------------------------------
# Hex Encoding
# ------------------------------------------------------------
# Converts binary data into hexadecimal strings and back.
#
# Commonly useful when displaying or storing SHA-256 hashes,
# since hash values are naturally represented as hexadecimal.
hex = "0.4"