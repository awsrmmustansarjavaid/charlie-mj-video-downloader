# ============================================================
# Charlie MJ Video Downloader - Rust/Tauri Package
# ============================================================
# This Cargo manifest defines the Rust backend package used by
# the Charlie MJ Video Downloader desktop application.
#
# Application architecture:
#
#   React + TypeScript frontend
#             ↓
#           Tauri
#             ↓
#       Rust backend
#             ↓
#   ┌─────────┼─────────────────────┐
#   │         │                     │
# SQLite   Downloader             FFmpeg
#   │         │                     │
#   └─────────┴──────────┬──────────┘
#                        ↓
#               Windows Desktop App
#
# This file controls:
# - The Rust package metadata
# - The Rust library crate
# - Tauri build support
# - Tauri runtime dependencies
# - Tauri official plugins
# - Application networking
# - SQLite database support
# - Asynchronous processing
# - Serialization
#
# IMPORTANT:
# This is a normal Cargo package manifest.
# It is NOT a virtual workspace manifest.
#
# Therefore, [package] is required and no [workspace] section
# is defined here.
#
# ============================================================
# TAURI VERSION NOTE
# ============================================================
#
# The frontend uses the Tauri 2.x npm packages:
#
#   @tauri-apps/api = 2.11.5
#   @tauri-apps/cli = 2.11.5
#
# Tauri's npm packages and Rust crates are related, but their
# individual patch versions do NOT have to be identical.
#
# In particular, do NOT assume that:
#
#   @tauri-apps/api 2.11.5
#
# means every Rust crate must also have:
#
#   2.11.5
#
# Cargo can only use versions that are actually published for
# each Rust crate.
#
# The official Tauri Rust framework is kept on the Tauri 2.x
# release family, while the official plugins use versions that
# are actually available as Rust crates.
#
# ============================================================


# ============================================================
# Package Configuration
# ============================================================

[package]

# ------------------------------------------------------------
# Package Name
# ------------------------------------------------------------
# Name of the Rust package.
name = "charlie-mj-video-downloader"


# ------------------------------------------------------------
# Application Version
# ------------------------------------------------------------
# Current application version.
#
# Keep this synchronized with the application release version.
version = "0.2.0"


# ------------------------------------------------------------
# Package Description
# ------------------------------------------------------------
# Short description of the application.
description = "Charlie MJ Video Downloader"


# ------------------------------------------------------------
# Package Authors
# ------------------------------------------------------------
# Maintainer/contributor information.
authors = ["Charlie MJ contributors"]


# ------------------------------------------------------------
# Rust Edition
# ------------------------------------------------------------
# Rust 2021 edition.
#
# This controls the Rust language edition and related compiler
# behavior used by the project.
edition = "2021"


# ============================================================
# Library Configuration
# ============================================================
# Tauri uses this library crate for the application's primary
# Rust backend logic.
#
# Application entry point:
#
#   app/src-tauri/src/main.rs
#
# Main Tauri application setup:
#
#   app/src-tauri/src/lib.rs

[lib]

# ------------------------------------------------------------
# Library Name
# ------------------------------------------------------------
# Rust library crate name.
#
# The Cargo package uses hyphens, while the Rust library crate
# uses underscores so it can be referenced as a Rust identifier.
name = "charlie_mj_video_downloader_lib"


# ------------------------------------------------------------
# Library Output Types
# ------------------------------------------------------------
# Output formats used by the Rust/Tauri build.
#
# staticlib:
#   Static library output.
#
# cdylib:
#   C-compatible dynamic library output.
#
# rlib:
#   Standard Rust library output.
crate-type = ["staticlib", "cdylib", "rlib"]


# ============================================================
# Build Dependencies
# ============================================================
# Dependencies used during the Cargo build process.

[build-dependencies]


# ------------------------------------------------------------
# Tauri Build Support
# ------------------------------------------------------------
# Provides Tauri build-time integration.
#
# The project's build script uses:
#
#   tauri_build::build()
#
# from:
#
#   app/src-tauri/build.rs
#
# Tauri Build 2.x is used to match the Tauri 2.x application.
tauri-build = { version = "2.0.0" }


# ============================================================
# Runtime / Application Dependencies
# ============================================================
# Runtime dependencies compiled into the desktop application.

[dependencies]


# ============================================================
# Tauri Framework
# ============================================================
# Main framework connecting the React frontend to the Rust
# desktop backend.
#
# tray-icon:
#   Enables system-tray functionality.
#
# The 2.x requirement allows Cargo to resolve an available
# compatible Tauri 2.x release rather than requiring a specific
# patch version that may not exist for every related crate.
tauri = { version = "2", features = ["tray-icon"] }


# ============================================================
# Tauri Dialog Plugin
# ============================================================
# Provides native desktop dialog functionality.
#
# Typical uses:
# - File selection
# - Folder selection
# - Confirmation dialogs
# - Native application dialogs
#
# This remains on the stable Tauri 2.x plugin line.
tauri-plugin-dialog = "2.0.0"


# ============================================================
# Tauri File System Plugin
# ============================================================
# Provides controlled filesystem functionality for the desktop
# application.
#
# Typical uses:
# - Reading files
# - Writing files
# - Selecting download locations
# - Managing application files
# - Working with local application data
#
# This remains on the stable Tauri 2.x plugin line.
tauri-plugin-fs = "2.0.0"


# ============================================================
# Tauri Notification Plugin
# ============================================================
# Provides native desktop notification functionality.
#
# Typical application events:
# - Download started
# - Download completed
# - Download failed
# - Other application notifications
#
# This remains on the stable Tauri 2.x plugin line.
tauri-plugin-notification = "2.0.0"


# ============================================================
# Serde
# ============================================================
# Serialization and deserialization framework for Rust.
#
# derive:
#   Automatically generates Serialize and Deserialize
#   implementations.
#
# Used for structured application data exchanged between the
# Rust backend and the frontend.
serde = { version = "1", features = ["derive"] }


# ============================================================
# Serde JSON
# ============================================================
# JSON serialization and deserialization.
#
# Used for structured data exchanged between:
# - React
# - Rust
# - Application components
# - Browser/media capture functionality
serde_json = "1"


# ============================================================
# Tokio
# ============================================================
# Asynchronous runtime used by the Rust backend.
#
# Used for:
# - Downloads
# - Networking
# - External processes
# - Background tasks
# - Timers
# - Synchronization
#
# Enabled features:
#
# process:
#   Start and manage external processes such as FFmpeg.
#
# sync:
#   Synchronization primitives.
#
# rt-multi-thread:
#   Multi-threaded asynchronous runtime.
#
# macros:
#   Tokio helper macros.
#
# time:
#   Asynchronous timers.
#
# net:
#   Networking functionality.
#
# io-util:
#   Asynchronous I/O utilities.
tokio = {
    version = "1",
    features = [
        "process",
        "sync",
        "rt-multi-thread",
        "macros",
        "time",
        "net",
        "io-util"
    ]
}


# ============================================================
# UUID
# ============================================================
# Generates unique identifiers for application objects.
#
# v4:
#   Random UUID version 4 generation.
#
# serde:
#   Serialization/deserialization support.
#
# Potential uses:
# - Download job IDs
# - Browser capture IDs
# - Stream IDs
# - Application records
uuid = { version = "1", features = ["v4", "serde"] }


# ============================================================
# Rusqlite
# ============================================================
# Rust interface for SQLite.
#
# bundled:
#   Builds SQLite together with the application so a separate
#   system SQLite installation is not required.
#
# Potential application data:
# - Download history
# - Browser capture records
# - Application settings
# - Download metadata
rusqlite = { version = "0.32", features = ["bundled"] }


# ============================================================
# URL
# ============================================================
# URL parsing and manipulation.
#
# Used for:
# - HTTP/HTTPS URL validation
# - URL component processing
# - Media URL processing
# - Captured stream URL normalization
url = "2"


# ============================================================
# Chrono
# ============================================================
# Date and time functionality.
#
# serde:
#   Serialization/deserialization support.
#
# Used for:
# - Download timestamps
# - Browser capture timestamps
# - Application history
chrono = { version = "0.4", features = ["serde"] }


# ============================================================
# Thiserror
# ============================================================
# Utilities for defining structured application-specific
# Rust error types.
thiserror = "2"


# ============================================================
# Reqwest
# ============================================================
# HTTP client used for network requests and direct media
# downloads.
#
# default-features = false:
#   Disables Reqwest's default feature set so the application
#   explicitly controls enabled functionality.
#
# rustls-tls:
#   HTTPS/TLS support using Rustls.
#
# stream:
#   Enables streaming HTTP response bodies.
#
# Streaming allows large downloads to be processed in chunks
# rather than loading the complete response into memory.
reqwest = {
    version = "0.12",
    default-features = false,
    features = [
        "rustls-tls",
        "stream"
    ]
}


# ============================================================
# Futures Util
# ============================================================
# Utilities for Rust Futures and asynchronous streams.
#
# Used together with Tokio and Reqwest for streaming download
# operations.
futures-util = "0.3"


# ============================================================
# SHA-256
# ============================================================
# Provides SHA-2 cryptographic hashing algorithms.
#
# Potential uses:
# - File integrity verification
# - Download verification
# - Content hashing
# - Comparing downloaded files
sha2 = "0.10"


# ============================================================
# Hex Encoding
# ============================================================
# Converts binary values to hexadecimal strings and hexadecimal
# strings back to binary data.
#
# Useful for representing SHA-256 hashes in a readable format.
hex = "0.4"